[package]
name = "deadhand-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/KrishnanKamatchi/deadhand"
description = "Static analysis of JS/TS repositories for human maintainability"

[dependencies]
ignore = "0.4.33"
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_parser = "0.152.0"
oxc_resolver = "11.24.3"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
petgraph = { version = "0.8.3", default-features = false, features = ["graphmap", "stable_graph"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
