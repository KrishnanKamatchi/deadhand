[package]
name = "deadhand"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Measure how hard a JS/TS repository is for a person to maintain"
readme = "../../README.md"
keywords = ["typescript", "javascript", "maintainability", "static-analysis", "cli"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/KrishnanKamatchi/deadhand"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
deadhand-core = { version = "0.1.0", path = "../deadhand-core" }
owo-colors = "4.4.0"
serde_json = "1.0.151"

[dev-dependencies]
insta = "1.48.0"
